/* =========================================================
   TOKENS — warna diambil dari logo Antheia (navy #1E2E5E)
   ========================================================= */
:root{
  color-scheme: light;
  --font: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --display: "Fraunces", Georgia, serif;
  --paper:#F5F3EE; --surface:#FFFFFF; --surface-2:#FAF9F6; --surface-3:#F0EEE7;
  --line:#E7E4DB; --line-2:#D8D4C8;
  --ink:#141A2B; --ink-2:#4B5266; --muted:#80858F;
  --primary:#1E2E5E; --primary-hover:#2A3F7C; --primary-ink:#FFFFFF; --accent:#1E2E5E;
  --navy-soft:#E9EDF7; --sand:#EFE6D2; --sand-ink:#6F5524;
  --side:#1A2850; --side-2:#22336A; --side-ink:#E9EDF8; --side-muted:#A3AECB;
  --ksu:#2f5fbf; --kss:#e8743b;
  --good:#0ca30c; --good-ink:#0a6e0a; --good-soft:#E6F4E6;
  --warn:#fab219; --warn-ink:#7f5300; --warn-soft:#FFF3D6;
  --crit:#d03b3b; --crit-ink:#b02e2e; --crit-soft:#FBE7E7;
  --grid:#ECEAE3; --axis:#C6C2B6;
  --shadow: 0 1px 2px rgba(20,26,43,.04), 0 6px 18px rgba(20,26,43,.05);
  --shadow-lg: 0 18px 50px rgba(15,22,45,.22);
  --r: 14px; --r-sm: 10px;
  --heat-0:#cde2fb; --heat-1:#9ec5f4; --heat-2:#6da7ec; --heat-3:#3987e5; --heat-4:#256abf; --heat-5:#184f95; --heat-6:#0d366b;
  --heat-ink-dark-from: 3;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --paper:#0C1222; --surface:#141C30; --surface-2:#18213A; --surface-3:#1F2946;
    --line:#243050; --line-2:#2F3C62;
    --ink:#EEF1F7; --ink-2:#B9C0D0; --muted:#8A92A6;
    --primary:#3C5BB5; --primary-hover:#4B6BC7; --primary-ink:#FFFFFF; --accent:#A9BDF2;
    --navy-soft:#1E2A4D; --sand:#2B2619; --sand-ink:#E5D1A0;
    --side:#0E1530; --side-2:#18224A; --side-ink:#E9EDF8; --side-muted:#8E99BA;
    --ksu:#5a86e2; --kss:#d8703c;
    --good-ink:#47c947; --good-soft:#12301B; --warn-ink:#fbc54d; --warn-soft:#33290F; --crit-ink:#f08080; --crit-soft:#3A1A1F;
    --grid:#212B45; --axis:#38446C;
    --shadow: 0 1px 2px rgba(0,0,0,.3); --shadow-lg: 0 18px 50px rgba(0,0,0,.55);
    --heat-0:#1d2b4a; --heat-1:#1f3c70; --heat-2:#235097; --heat-3:#2a66bd; --heat-4:#3a80dd; --heat-5:#6aa3ec; --heat-6:#a9cbf6;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --paper:#0C1222; --surface:#141C30; --surface-2:#18213A; --surface-3:#1F2946;
  --line:#243050; --line-2:#2F3C62;
  --ink:#EEF1F7; --ink-2:#B9C0D0; --muted:#8A92A6;
  --primary:#3C5BB5; --primary-hover:#4B6BC7; --primary-ink:#FFFFFF; --accent:#A9BDF2;
  --navy-soft:#1E2A4D; --sand:#2B2619; --sand-ink:#E5D1A0;

  --grid:#212B45; --axis:#38446C;
  --shadow: 0 1px 2px rgba(0,0,0,.3); --shadow-lg: 0 18px 50px rgba(0,0,0,.55);
  --heat-0:#1d2b4a; --heat-1:#1f3c70; --heat-2:#235097; --heat-3:#2a66bd; --heat-4:#3a80dd; --heat-5:#6aa3ec; --heat-6:#a9cbf6;
}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.ico{flex:none;display:block}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* =========================================================
   LAYOUT
   ========================================================= */
.app{display:flex;min-height:100vh}
.side{position:sticky;top:0;height:100vh;width:248px;flex:none;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;padding:22px 14px 16px;overflow:hidden}
.side::after{content:"";position:absolute;inset:auto -40px -60px auto;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.06),transparent 70%);pointer-events:none}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px 22px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:14px}
.brand .logo{width:46px;height:47px;color:#fff}
.brand b{display:block;font-family:var(--display);font-size:19px;font-weight:600;letter-spacing:.2px;line-height:1.1}
.brand span{display:block;font-size:11.5px;color:var(--side-muted);margin-top:3px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;color:var(--side-muted);padding:10px 12px;border-radius:10px;cursor:pointer;text-align:left;font-weight:500;transition:background .15s,color .15s}
.nav button:hover{background:rgba(255,255,255,.06);color:var(--side-ink)}
.nav button[aria-current="page"]{background:var(--side-2);color:#fff;box-shadow:inset 3px 0 0 #C9D6FF}
.nav .badge{margin-left:auto;background:rgba(255,255,255,.12);color:#fff;font-size:11px;font-weight:600;padding:1px 7px;border-radius:99px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:12px 8px 0;border-top:1px solid rgba(255,255,255,.08)}
.sync{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--side-muted);background:transparent;border:0;padding:6px 0;cursor:pointer;text-align:left}
.sync i{width:8px;height:8px;border-radius:50%;background:#7ad97a;box-shadow:0 0 0 3px rgba(122,217,122,.18);flex:none}
.sync.demo i{background:#f0c25a;box-shadow:0 0 0 3px rgba(240,194,90,.18)}
.sync.err i{background:#f08080;box-shadow:0 0 0 3px rgba(240,128,128,.18)}
.sync.busy i{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
.side-tools{display:flex;gap:6px}
.side-tools button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid rgba(255,255,255,.12);background:transparent;color:var(--side-ink);border-radius:9px;padding:7px;cursor:pointer;font-size:12px}
.side-tools button:hover{background:rgba(255,255,255,.06)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.mbar{display:none}
.wrap{width:100%;max-width:1320px;margin:0 auto;padding:26px 30px 60px}
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.phead h1{font-family:var(--display);font-weight:600;font-size:30px;line-height:1.1;margin:0;letter-spacing:-.2px;color:var(--ink)}
.phead p{margin:6px 0 0;color:var(--ink-2)}
.phead .actions{display:flex;gap:8px;flex-wrap:wrap}

/* Filter row */
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.fl{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 4px 0 10px;height:38px}
.fl label{font-size:12px;color:var(--muted);white-space:nowrap}
.fl select{border:0;background:transparent;height:36px;padding:0 6px;outline:none;cursor:pointer;font-weight:500;max-width:190px}
.fl:focus-within{border-color:var(--ksu);box-shadow:0 0 0 3px color-mix(in srgb,var(--ksu) 18%,transparent)}
.search{position:relative;flex:1;min-width:200px;max-width:340px}
.search .ico{position:absolute;left:11px;top:10px;color:var(--muted)}
.search input{width:100%;height:38px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 12px 0 36px;outline:none}
.search input:focus{border-color:var(--ksu);box-shadow:0 0 0 3px color-mix(in srgb,var(--ksu) 18%,transparent)}
.seg{display:inline-flex;background:var(--surface-3);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;cursor:pointer;font-weight:500;color:var(--ink-2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

.frow{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.frow .search{flex:0 1 300px;min-width:220px}
.frow .filters{flex:1 1 auto;min-width:0}
/* Buttons */
.btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--surface-2);border-color:var(--line-2)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.primary:hover{background:var(--primary-hover)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{height:32px;padding:0 10px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:9px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--ink-2)}
.icon-btn:hover{background:var(--surface-3);color:var(--ink)}
:focus-visible{outline:2px solid var(--ksu);outline-offset:2px}

/* Cards */
.grid{display:grid;gap:16px}
.g-hero{grid-template-columns:1.25fr 1fr 1fr;}
.g-2{grid-template-columns:1.6fr 1fr}
.g-2e{grid-template-columns:1fr 1fr}
.g-4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 18px 16px;min-width:0}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-h h2{font-size:15px;font-weight:600;margin:0;line-height:1.3}
.card-h p{margin:3px 0 0;font-size:12.5px;color:var(--muted)}
.card-h .tools{display:flex;gap:4px;align-items:center}
.mt{margin-top:16px}

/* Hero */
.hero{position:relative;overflow:hidden;background:linear-gradient(140deg,#1E2E5E 0%,#22377A 60%,#2B4790 100%);color:#fff;border:0;grid-row:span 2;display:flex;flex-direction:column;padding:22px}
.hero .waves{position:absolute;right:-30px;bottom:-12px;width:360px;opacity:.16;pointer-events:none}
.hero .logo{position:absolute;right:18px;top:16px;width:58px;height:59px;color:#fff;opacity:.9}
.hero .lbl{font-size:13px;color:#C8D3F2;font-weight:500}
.hero .big{font-size:52px;font-weight:700;letter-spacing:-1.2px;line-height:1.05;margin:10px 0 6px}
.hero .full{font-size:13px;color:#C8D3F2}
.hero .row{display:flex;gap:22px;margin-top:auto;padding-top:22px;flex-wrap:wrap}
.hero .row div{min-width:0;flex:1 1 0}
.hero .row b{display:block;font-size:18px;font-weight:600}
.hero .row span{font-size:12px;color:#C8D3F2}
.hero .split{display:flex;height:8px;border-radius:99px;overflow:hidden;gap:2px;margin-top:16px;background:rgba(255,255,255,.12)}
.hero .split i{display:block;height:100%}
.hero .legend{display:flex;gap:14px;margin-top:8px;font-size:12px;color:#DDE5FA}
.hero .legend span{display:inline-flex;align-items:center;gap:6px}
.hero .legend span::before{content:"";width:10px;height:4px;border-radius:2px;background:var(--c)}
:root[data-theme="dark"] .hero{background:linear-gradient(140deg,#16224A 0%,#1C2D63 60%,#24397A 100%)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hero{background:linear-gradient(140deg,#16224A 0%,#1C2D63 60%,#24397A 100%)}}

/* Stat tile */
.tile{display:flex;flex-direction:column;gap:4px}
.tile .lbl{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);font-weight:500}
.tile .lbl .ico{color:var(--muted)}
.tile .val{font-size:30px;font-weight:700;letter-spacing:-.5px;line-height:1.15;margin-top:4px}
.tile .val small{font-size:15px;font-weight:600;color:var(--ink-2);letter-spacing:0;margin-left:4px}
.tile .sub{font-size:12.5px;color:var(--muted)}
.tile .delta{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600}
.delta.up{color:var(--good-ink)} .delta.down{color:var(--crit-ink)} .delta.flat{color:var(--muted)}
.seg-bar{display:flex;height:8px;gap:2px;margin:10px 0 6px}
.seg-bar i{display:block;height:100%;border-radius:99px}
.keys{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--ink-2)}
.keys span{display:inline-flex;align-items:center;gap:6px}
.keys .sw{width:10px;height:10px;border-radius:3px;background:var(--c)}
.keys .ln{width:14px;height:2px;border-radius:2px;background:var(--c)}
.tile.link{cursor:pointer;transition:border-color .15s, transform .15s}
.tile.link:hover{border-color:var(--line-2)}

/* Chips & badges */
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--surface-3);color:var(--ink-2)}
.chip .ico{width:13px;height:13px}
.chip.good{background:var(--good-soft);color:var(--good-ink)}
.chip.warn{background:var(--warn-soft);color:var(--warn-ink)}
.chip.crit{background:var(--crit-soft);color:var(--crit-ink)}
.chip.info{background:var(--navy-soft);color:var(--accent)}
.chip.sand{background:var(--sand);color:var(--sand-ink)}
.chip.outline{background:transparent;border:1px solid var(--line-2);color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--ink-2)}
.tag::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c)}
.tag.ksu{--c:var(--ksu)} .tag.kss{--c:var(--kss)}

/* Charts */
.chart{position:relative;width:100%}
.chart svg{display:block;overflow:visible}
.chart text{font-family:var(--font);font-size:11px;fill:var(--muted)}
.chart .gl{stroke:var(--grid);stroke-width:1;shape-rendering:crispEdges}
.chart .bl{stroke:var(--axis);stroke-width:1;shape-rendering:crispEdges}
.chart .cross{stroke:var(--axis);stroke-width:1}
.chart .endl{font-size:12px;font-weight:600;fill:var(--ink)}
.chart .endn{font-size:11px;fill:var(--ink-2)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-bottom:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .ln{width:16px;height:2px;border-radius:2px;background:var(--c)}
.legend .sw{width:10px;height:10px;border-radius:3px;background:var(--c)}
.is-syncing .chart,.is-syncing .tbl{opacity:.6;transition:opacity .2s}

.hbars{display:flex;flex-direction:column;gap:7px}
.hbar{display:grid;grid-template-columns:var(--lw,92px) 1fr;align-items:center;gap:10px;font-size:12.5px;padding:2px 0;border-radius:6px;cursor:default}
.hbar .nm{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .tr{display:flex;align-items:center;gap:8px;min-width:0}
.hbar .b{height:14px;border-radius:0 4px 4px 0;background:var(--c);min-width:2px;transition:filter .15s}
.hbar .v{font-weight:600;color:var(--ink);white-space:nowrap}
.hbar .v small{font-weight:500;color:var(--muted)}
.hbar:hover .b,.hbar:focus .b{filter:brightness(1.12)}
.hbar:focus{outline:none;background:var(--surface-2)}

.heat{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
.heat-g{display:grid;gap:2px;min-width:max-content}
.heat-g .hc{height:38px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums;cursor:default}
.heat-g .hc:hover,.heat-g .hc:focus{outline:2px solid var(--ink);outline-offset:-2px}
.heat-g .hc.na{background:var(--surface-3);color:var(--muted);font-weight:500}
.heat-g .hr{position:sticky;left:0;background:var(--surface);display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);padding-right:8px;z-index:1;white-space:nowrap}
.heat-g .hh{font-size:11px;color:var(--muted);text-align:center;padding-bottom:4px;white-space:nowrap}
.heat-scale{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.heat-scale .steps{display:flex;gap:2px}
.heat-scale .steps i{width:26px;height:10px;border-radius:2px}

/* Tooltip */
#tip{position:fixed;z-index:80;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line-2);border-radius:10px;box-shadow:var(--shadow-lg);padding:9px 11px;font-size:12.5px;min-width:140px;max-width:280px;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}
#tip.on{opacity:1;transform:none}
#tip .t{font-size:11.5px;color:var(--muted);margin-bottom:5px;font-weight:500}
#tip .r{display:flex;align-items:center;gap:8px;margin-top:3px}
#tip .r b{font-weight:700;font-variant-numeric:tabular-nums}
#tip .r span{color:var(--ink-2)}
#tip .k{width:12px;height:2px;border-radius:2px;background:var(--c);flex:none}
#tip .ks{width:9px;height:9px;border-radius:2px;background:var(--c);flex:none}

/* Tables */
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.tbl th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-weight:600;font-size:12px;color:var(--ink-2);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
.tbl th.sortable{cursor:pointer;user-select:none}
.tbl th.sortable:hover{color:var(--ink)}
.tbl th .arr{opacity:.5;margin-left:3px}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{transition:background .1s}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover{background:var(--surface-2)}
.tbl tbody tr.sel{background:var(--navy-soft)}
.tbl .r{text-align:right;white-space:nowrap}
.tbl .muted{color:var(--muted)}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r-sm);max-height:70vh;background:var(--surface)}
.card .tbl-wrap{border-radius:10px}
.nm-cell b{display:block;font-weight:600}
.nm-cell span{font-size:11.5px;color:var(--muted)}
.dots{display:inline-flex;gap:4px;align-items:center}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--surface-3);box-shadow:inset 0 0 0 1.5px var(--line-2)}
.dots i.h{background:var(--good);box-shadow:none}
.dots i.t{background:var(--crit);box-shadow:none}
.rate{display:flex;align-items:center;gap:8px;min-width:110px}
.rate .bar{flex:1;height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden;max-width:70px}
.rate .bar i{display:block;height:100%;background:var(--ksu);border-radius:99px}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}

/* Absensi */
.abs-top{display:grid;grid-template-columns:auto auto 1fr auto;gap:10px;align-items:center;margin-bottom:12px}
.pills{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-weight:500;font-size:13px;cursor:pointer;white-space:nowrap;color:var(--ink-2)}
.pill[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.pill small{opacity:.7;margin-left:4px}
.abs-sum{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
.abs-list{display:flex;flex-direction:column;gap:8px}
.arow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 10px 10px 14px;transition:border-color .15s, background .15s}
.arow.dirty{border-color:color-mix(in srgb,var(--ksu) 55%,var(--line))}
.arow .who b{display:block;font-weight:600}
.arow .who span{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tog{display:inline-flex;align-items:center;gap:8px;height:42px;min-width:128px;justify-content:center;border-radius:11px;border:1.5px solid var(--line-2);background:var(--surface-2);font-weight:600;cursor:pointer;color:var(--ink-2);padding:0 14px}
.tog.on{background:var(--good-soft);border-color:var(--good);color:var(--good-ink)}
.tog.off{background:var(--crit-soft);border-color:color-mix(in srgb,var(--crit) 60%,transparent);color:var(--crit-ink)}
.reasons{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding-top:2px}
.reasons button{border:1px dashed var(--line-2);background:transparent;border-radius:99px;padding:4px 10px;font-size:12px;cursor:pointer;color:var(--ink-2)}
.reasons button[aria-pressed="true"]{border-style:solid;border-color:var(--crit);background:var(--crit-soft);color:var(--crit-ink);font-weight:600}
.reasons input{flex:1;min-width:140px;height:30px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:var(--surface);outline:none;font-size:12.5px}
.savebar{position:sticky;bottom:0;z-index:20;margin-top:14px;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);padding:10px 12px;display:flex;align-items:center;gap:12px}
.savebar .info{flex:1;font-size:13px;color:var(--ink-2)}
.savebar .info b{color:var(--ink)}

/* Kanban */
.kanban{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:14px;overflow-x:auto;padding-bottom:6px}
.kcol{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-width:0}
.kcol h3{display:flex;align-items:center;gap:8px;font-size:13.5px;margin:2px 4px 12px}
.kcol h3 .n{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;cursor:pointer;transition:border-color .15s, box-shadow .15s}
.kcard:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.kcard b{display:block;font-weight:600}
.kcard .meta{font-size:12px;color:var(--muted);margin:2px 0 8px;display:flex;gap:8px;flex-wrap:wrap}
.kcard p{margin:8px 0 0;font-size:12.5px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.kcard .chips{display:flex;gap:4px;flex-wrap:wrap}

/* Drawer & modal */
.scrim{position:fixed;inset:0;background:rgba(10,15,30,.42);z-index:60;opacity:0;transition:opacity .2s;backdrop-filter:blur(2px)}
.scrim.on{opacity:1}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--surface);z-index:61;box-shadow:var(--shadow-lg);transform:translateX(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.drawer.on{transform:none}
.dr-h{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.dr-b{padding:18px;overflow:auto;flex:1}
.avatar{width:64px;height:64px;border-radius:16px;background:var(--navy-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:22px;flex:none;overflow:hidden;font-family:var(--display)}
.avatar img{width:100%;height:100%;object-fit:cover}
.prof{display:flex;gap:14px;align-items:center;margin-bottom:16px}
.prof h3{margin:0;font-size:18px;line-height:1.25}
.prof .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.prof .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:8px 12px;font-size:13px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500;word-break:break-word}
.sec{margin-top:22px}
.sec h4{font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:600}
.mini-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini-stats div{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px}
.mini-stats b{display:block;font-size:17px}
.mini-stats span{font-size:11.5px;color:var(--muted)}
.timeline{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.tl{border:1px solid var(--line);border-radius:9px;padding:6px 6px 7px;text-align:center;font-size:11px;color:var(--muted);background:var(--surface-2)}
.tl b{display:flex;justify-content:center;margin-top:4px}
.tl.h{background:var(--good-soft);border-color:transparent;color:var(--good-ink)}
.tl.t{background:var(--crit-soft);border-color:transparent;color:var(--crit-ink)}
.tl.n{opacity:.6}
.notes{margin:10px 0 0;padding:0;list-style:none;font-size:12.5px}
.notes li{display:flex;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}
.notes li span{color:var(--muted);min-width:70px}

.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%);opacity:0;width:min(560px,calc(100% - 24px));max-height:calc(100% - 40px);display:flex;flex-direction:column;background:var(--surface);border-radius:18px;box-shadow:var(--shadow-lg);z-index:62;transition:opacity .18s, transform .18s}
.modal.on{opacity:1;transform:translate(-50%,-50%)}
.md-h{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
.md-h h3{margin:0;font-size:16px}
.md-b{padding:18px;overflow:auto}
.md-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.form .full{grid-column:1/-1}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.field input:not([type=checkbox]),.field select,.field textarea{width:100%;height:40px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);padding:0 11px;outline:none}
.field textarea{height:auto;min-height:88px;padding:9px 11px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--ksu);box-shadow:0 0 0 3px color-mix(in srgb,var(--ksu) 18%,transparent)}
.field .hint{font-size:11.5px;color:var(--muted);margin-top:4px}
.checks{display:flex;gap:6px;flex-wrap:wrap}
.checks label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:99px;padding:6px 11px;font-size:12.5px;font-weight:500;cursor:pointer;margin:0;color:var(--ink)}
.checks input{accent-color:var(--primary)}
.checks label:has(input:checked){background:var(--navy-soft);border-color:var(--ksu)}
.rule{display:flex;gap:12px;align-items:flex-start;background:var(--sand);color:var(--sand-ink);border-radius:12px;padding:12px 14px;font-size:13px;margin-bottom:16px}
.rule b{color:inherit}

/* Toast */
#toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;background:#141A2B;color:#fff;border-radius:12px;padding:10px 14px;box-shadow:var(--shadow-lg);font-size:13px;max-width:min(520px,calc(100vw - 32px));animation:tin .2s}
.toast.err{background:#8f2424}
.toast.ok .ico{color:#7ad97a}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}

/* Loading */
.boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:16px;background:var(--paper);z-index:100;color:var(--accent);overflow-y:auto;padding:24px 0}
.boot > :first-child{margin-top:auto}
.boot > :last-child{margin-bottom:auto}
.boot .logo{width:92px;height:94px;animation:breathe 1.6s ease-in-out infinite}
.boot p{margin:0;color:var(--muted);font-size:13px}
@keyframes breathe{50%{opacity:.45;transform:scale(.97)}}

.next{display:flex;flex-direction:column;gap:12px}
.next .date{display:flex;gap:12px;align-items:center}
.next .cal{width:56px;height:60px;border-radius:12px;background:var(--navy-soft);color:var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.next .cal b{font-size:20px;line-height:1}
.next .cal span{font-size:11px;font-weight:600;text-transform:uppercase}
.next ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.next li{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:8px 10px;background:var(--surface-2);border-radius:9px}
.next li span{color:var(--ink-2)}

/* Login */
.login{width:min(380px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-lg);padding:28px 24px 22px;display:flex;flex-direction:column;gap:12px;color:var(--ink)}
.login .logo{width:76px;height:78px;color:var(--accent);margin:0 auto}
.login h1{font-family:var(--display);font-weight:600;font-size:26px;margin:4px 0 0;text-align:center}
.login .sub{margin:-6px 0 6px;text-align:center;color:var(--muted);font-size:13px}
.login label{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--ink-2)}
.login input{height:46px;border:1px solid var(--line-2);border-radius:12px;background:var(--surface);padding:0 14px;font-size:16px;outline:none;color:var(--ink)}
.login input:focus{border-color:var(--ksu);box-shadow:0 0 0 3px color-mix(in srgb,var(--ksu) 18%,transparent)}
.login .btn{height:46px;justify-content:center;font-size:15px;margin-top:4px}
.login .hint{margin:4px 0 0;font-size:12px;color:var(--muted);text-align:center}
.lerr{display:flex;gap:8px;align-items:center;background:var(--crit-soft);color:var(--crit-ink);border-radius:10px;padding:9px 12px;font-size:13px;font-weight:500}
.lhelp{font-size:12.5px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.lhelp ol{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.lhelp code{font-size:11.5px;background:var(--surface-3);padding:0 4px;border-radius:4px}
.side-who{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--side-ink);opacity:.9}
.side-who:empty{display:none}

/* Tab absensi */
.abs-tabs{margin:0 0 16px}
.abs-tabs button{display:inline-flex;align-items:center;gap:7px;padding:8px 14px}

/* Scan QR */
.scan-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
.scan-main{display:flex;flex-direction:column;gap:12px}
.scan-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.cam-box{position:relative;aspect-ratio:4/3;background:#0b1224;border-radius:14px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.cam-box video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .2s}
.cam-box.live video{opacity:1}
.cam-guide{position:absolute;width:58%;aspect-ratio:1;pointer-events:none;opacity:.35;transition:opacity .2s}
.cam-box.live .cam-guide{opacity:1}
.cam-guide i{position:absolute;width:28px;height:28px;border:4px solid #fff;border-radius:6px}
.cam-guide i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0}
.cam-guide i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0}
.cam-guide i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0}
.cam-guide i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0}
.cam-msg{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;color:#dfe6fa;padding:18px;max-width:340px;font-size:13px}
.cam-msg b{font-size:15px;color:#fff}
.flash{position:absolute;left:12px;right:12px;bottom:12px;z-index:3;display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;color:#fff;transform:translateY(130%);transition:transform .22s cubic-bezier(.2,.8,.2,1);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.flash.on{transform:none}
.flash b{display:block;font-size:17px;line-height:1.2}
.flash span{font-size:13px;opacity:.92}
.flash.ok{background:#0e7a32}
.flash.warn{background:#a36a00}
.flash.err{background:#b02e2e}
.flash.busy{background:#1E2E5E}
.scan-btns{display:flex;gap:8px;flex-wrap:wrap}
.scan-btns .btn{flex:1;justify-content:center;height:46px;font-size:15px}
.scan-manual .search{max-width:none;width:100%}
.scan-manual input{height:44px !important;font-size:15px}
.sugg{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.sugg button{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 12px;cursor:pointer;color:var(--ink)}
.sugg button span{font-size:12px;color:var(--muted)}
.sugg button:disabled{opacity:.5;cursor:default}
.scan-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.scan-stats div{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.scan-stats b{display:block;font-size:22px;line-height:1.1}
.scan-stats b small{font-size:13px;color:var(--muted);font-weight:600}
.scan-stats span{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
.scan-list{display:flex;flex-direction:column;max-height:62vh;overflow:auto;margin:0 -6px}
.srow{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:9px 6px;border-bottom:1px solid var(--line)}
.srow .t{font-size:12px;color:var(--muted)}
.srow .who b{display:block;font-weight:600;font-size:13.5px}
.srow .who span{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
.srow .ok{color:var(--good-ink)} .srow .pend{color:var(--warn-ink)}
i.tag{display:inline-block}
i.tag::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--c)}

/* Cetak stiker QR */
#printArea{display:none}
body.printing #printArea{display:block}
@media print{
  @page{size:A4;margin:10mm}
  body.printing{background:#fff}
  body.printing > *:not(#printArea){display:none !important}
  #printArea{display:block}
}
.stk-grid{display:grid;grid-template-columns:repeat(5,38mm);grid-auto-rows:46mm;gap:0;justify-content:start}
.size-s .stk-grid{grid-template-columns:repeat(6,31.6mm);grid-auto-rows:39mm}
.stk{border:0.2mm dashed #bbb;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.5mm;overflow:hidden;color:#000;font-family:var(--font);break-inside:avoid;background:#fff}
.stk svg{width:30mm;height:30mm;display:block}
.size-s .stk svg{width:24mm;height:24mm}
.stk b{font-size:7pt;line-height:1.15;text-align:center;margin-top:1mm;max-height:2.3em;overflow:hidden}
.stk span{font-size:5.5pt;color:#333;text-align:center}
.stk em{font-size:5pt;color:#1E2E5E;font-style:normal;font-weight:700;letter-spacing:.2px}
.size-s .stk b{font-size:6pt}
@media screen{body.printing #printArea{position:fixed;inset:0;z-index:200;overflow:auto;background:#fff;padding:10mm}}

/* Bottom nav (mobile) */
.bnav{display:none}

}

  #toasts{bottom:86px}
}

  // Ambang: wilayah dianggap sudah diabsen bila ≥30% anaknya tercentang hadir (menghindari hitungan saat absensi baru mulai)

      if (r.tglTambah && r.tglTambah > p.endIso && r.att[p.i] !== 1) return;
      tot[r.kab] = (tot[r.kab] || 0) + 1;
      if (r.att[p.i] === 1) yes[r.kab] = (yes[r.kab] || 0) + 1;
    });
    Object.keys(tot).forEach(function (k) { o[k] = (yes[k] || 0) / tot[k] >= MIN_RECORDED; });
    return o;
  });
  P.forEach(function (p) { p.recorded = recorded[p.i]; });

    var elig = P.map(function (p) { return r.att[p.i] === 1 || !r.tglTambah || r.tglTambah <= p.endIso; });
    var eligA = P.map(function (p) { return elig[p.i] && p.absen && !!recorded[p.i][r.kab]; });
    var hadir = 0, total = 0, lastHadir = null;

    var base = st.mode === 'Berturut-turut' ? streak : absentKeys.length;
    var level = base > st.batas ? 'peringatan' : (base === st.batas && base > 0 ? 'waspada' : 'aman');
    var nom = nominal(r.status);
    var santunan = 0;
    P.forEach(function (p) { if (p.santunan && elig[p.i]) santunan += nom; });
    var o = Object.assign({}, r, {
      elig: elig, eligA: eligA, hadir: hadir, total: total, tidak: total - hadir, rate: total ? hadir / total : null,

  return { P: P, attP: attP, people: people, byId: byId, nominal: nominal, pulauKab: pulauKab, pulauList: pulauList };

    '<div>' + dTxt + '</div><div class="sub">' + (rl ? fmtN(rl.h) + ' hadir · ' + fmtN(rl.e - rl.h) + ' diwakilkan wali' : 'Belum ada absensi') + '</div></div>';

  h += '<div class="card tile link" data-act="go" data-page="peringatan" tabindex="0"><div class="lbl">' + ico('alert', 16) + 'Perlu peringatan</div><div class="val num">' + fmtN(warn.length) + '<small>anak</small></div>' +
    '<div class="sub">Tidak hadir &gt; ' + S.data.settings.batas + '× (' + (S.data.settings.mode === 'Total' ? 'total' : 'berturut-turut') + ')</div><div class="sub">' + fmtN(was.length) + ' anak waspada' + (np ? ' · wajib hadir ' + esc(np.label) : '') + '</div></div>';

  h += '<div class="card tile link" data-act="go" data-page="bantuan" tabindex="0"><div class="lbl">' + ico('heart', 16) + 'Bantuan lanjutan</div><div class="val num">' + fmtN(ban.length) + '<small>kasus</small></div>' +
    '<div class="keys" style="margin-top:6px">' + BAN_ORDER.filter(function (s) { return banCount(s); }).map(function (s) { return '<span>' + esc(BAN_LABEL[s]) + ' <b>' + banCount(s) + '</b></span>'; }).join('') + '</div></div>';
  h += '</div>';

  // Line chart + pulau
  h += '<div class="grid g-2 mt">';
  h += '<div class="card"><div class="card-h"><div><h2>Tingkat kehadiran per penyaluran</h2><p>Persentase anak yang hadir langsung (sisanya diwakilkan wali)</p></div>' + tableToggle('att') + '</div><div id="cAtt"></div></div>';
  h += '<div class="card"><div class="card-h"><div><h2>Penerima per pulau</h2><p>Jumlah anak terdaftar saat ini</p></div></div><div class="legend"><span><i class="sw" style="--c:var(--ksu)"></i>KSU · Utara</span><span><i class="sw" style="--c:var(--kss)"></i>KSS · Selatan</span></div><div id="cPulau"></div></div>';
  h += '</div>';

  // Heatmap
  h += '<div class="card mt"><div class="card-h"><div><h2>Peta kehadiran pulau × bulan</h2><p>' + (isDark() ? 'Semakin terang' : 'Semakin gelap') + ' semakin banyak anak yang hadir langsung (%)</p></div></div><div id="cHeat"></div></div>';

  // Alasan + berikutnya
  h += '<div class="grid g-2e mt">';
  h += '<div class="card"><div class="card-h"><div><h2>Alasan tidak hadir</h2><p>Dikelompokkan dari kolom keterangan · ' + esc(rangeLabel(AP)) + '</p></div></div><div id="cReason"></div></div>';
  h += '<div class="card"><div class="card-h"><div><h2>Penyaluran berikutnya</h2><p>Setiap minggu ke-3 · hari 1 KSU, hari 2 KSS</p></div></div>' + nextCard(np, F) + '</div>';
  h += '</div>';

  after.push(function () {
    var series = [];
    var kabs = S.f.kab ? [S.f.kab] : ['Utara', 'Selatan'];
    kabs.forEach(function (k) {
      var list = F.filter(function (r) { return r.kab === k; });
      if (!list.length) return;
      series.push({ name: kabShort(k), c: k === 'Utara' ? '--ksu' : '--kss', values: AP.map(function (p) { return rateAt(p, list).rate; }), list: list });
    });
    var spec = {
      labels: AP.map(function (p) { return p.short; }), full: AP.map(function (p) { return p.long; }), series: series,
      fmt: function (v) { return fmtPct(v); }, tick: function (t) { return Math.round(t * 100) + '%'; }, yMax: 1,
      yMin: Math.max(0, Math.floor((Math.min.apply(null, series.reduce(function (a, s) { return a.concat(s.values.filter(function (v) { return v != null; })); }, [1])) - 0.05) * 10) / 10),
      extra: function (s, i) { var r = rateAt(AP[i], s.list); return ' · ' + r.h + '/' + r.e; }, aria: 'Tingkat kehadiran per penyaluran'
    };

      el.innerHTML = '<div class="legend">' + series.map(function (s) { return '<span><i class="ln" style="--c:var(' + s.c + ')"></i>' + esc(s.name) + '</span>'; }).join('') + '</div><div class="chart"></div>';
      lineChart(el.querySelector('.chart'), spec);
    }, function () {
      return tableHtml(['Periode'].concat(series.map(function (s) { return s.name; })), AP.map(function (p, i) { return [p.long].concat(series.map(function (s) { var r = rateAt(p, s.list); return fmtPct(r.rate) + ' (' + r.h + '/' + r.e + ')'; })); }));
    });

    var rows = M.pulauList.map(function (p) {
      var n = F.filter(function (r) { return r.pulau === p; }).length;
      return { label: p, value: n, c: M.pulauKab[p] === 'Utara' ? '--ksu' : '--kss', tip: p + ' (' + kabShort(M.pulauKab[p]) + '): ' + n + ' anak' };
    }).filter(function (r) { return r.value > 0; });
    $('#cPulau').innerHTML = rows.length ? hbarsHtml(rows) : '<div class="empty">Tidak ada data</div>';

    heatmap($('#cHeat'), F, AP);

    var cats = {};
    AP.forEach(function (p) { F.forEach(function (r) { if (r.eligA[p.i] && r.att[p.i] !== 1) { var c = reasonCat(r.ket[p.key]); if (c) cats[c] = (cats[c] || 0) + 1; } }); });
    var rr = Object.keys(cats).map(function (k) { return { label: k, value: cats[k], c: k === 'Tanpa keterangan' ? '--axis' : '--ksu', tip: k + ': ' + cats[k] + ' kali' }; }).sort(function (a, b) { return b.value - a.value; });
    var tot = rr.reduce(function (s, r) { return s + r.value; }, 0);
    rr.forEach(function (r) { var sh = r.value / (tot || 1); r.valueText = fmtN(r.value) + ' <small>' + (sh < 0.005 ? '&lt;1%' : fmtPct(sh, 0)) + '</small>'; });
    $('#cReason').innerHTML = rr.length ? hbarsHtml(rr, 0, 128) : '<div class="empty">Belum ada ketidakhadiran tercatat</div>';
  });
  return h;
};

function nextCard(np, F) {
  if (!np) return '<div class="empty">Tidak ada periode mendatang di sheet absensi. Tambahkan kolom bulan berikutnya.</div>';
  var wajib = F.filter(function (r) { return r.level === 'peringatan'; });
  var ksuN = F.filter(function (r) { return r.kab === 'Utara'; }), kssN = F.filter(function (r) { return r.kab === 'Selatan'; });
  var sum = function (l) { return l.reduce(function (s, r) { return s + r.nominal; }, 0); };
  var dateTxt = np.tglKSU || np.tglKSS ? (np.tglKSU ? 'KSU ' + fmtDate(np.tglKSU) : '') + (np.tglKSS ? (np.tglKSU ? ' · ' : '') + 'KSS ' + fmtDate(np.tglKSS) : '') : 'Perkiraan 15–21 ' + MONTHS[np.month - 1] + ' ' + np.year;
  return '<div class="next"><div class="date"><div class="cal"><span>' + MON[np.month - 1] + '</span><b>' + String(np.year).slice(2) + '</b></div><div><b style="font-size:16px">' + esc(np.long) + '</b><div class="sub" style="color:var(--muted);font-size:12.5px">' + esc(dateTxt) + '</div></div></div>' +
    '<ul><li><span>Hari 1 · KSU (' + fmtN(ksuN.length) + ' anak)</span><b class="num">' + fmtRp(sum(ksuN)) + '</b></li>' +
    '<li><span>Hari 2 · KSS (' + fmtN(kssN.length) + ' anak)</span><b class="num">' + fmtRp(sum(kssN)) + '</b></li>' +
    '<li><span>Wajib hadir (peringatan)</span><b class="num">' + fmtN(wajib.length) + ' anak</b></li></ul>' +
    '<button class="btn primary" data-act="absensiFor" data-period="' + np.key + '">' + ico('clip') + 'Mulai absensi ' + esc(np.label) + '</button></div>';
}

function heatmap(el, F, AP) {
  var M = S.M;
  if (!AP.length) { el.innerHTML = '<div class="empty">Belum ada penyaluran dengan absensi</div>'; return; }
  var pulau = M.pulauList.filter(function (p) { return F.some(function (r) { return r.pulau === p; }); });
  var cols = 'grid-template-columns:120px repeat(' + AP.length + ',minmax(46px,1fr))';
  var h = '<div class="heat"><div class="heat-g" style="' + cols + '"><div></div>' + AP.map(function (p) { return '<div class="hh">' + esc(p.short) + '</div>'; }).join('');
  pulau.forEach(function (pl) {
    var list = F.filter(function (r) { return r.pulau === pl; });
    h += '<div class="hr"><span class="tag ' + kabCls(M.pulauKab[pl]) + '"></span>' + esc(pl) + '</div>';
    AP.forEach(function (p) {
      var r = rateAt(p, list);
      if (r.rate == null) { h += '<div class="hc na" tabindex="0" data-tip="' + esc(pl + ' · ' + p.long + ': tidak ada data') + '">–</div>'; return; }
      var k = heatIdx(r.rate);
      h += '<div class="hc" tabindex="0" style="background:var(--heat-' + k + ');color:' + heatInk(k) + '" data-tip="' + esc(pl + ' · ' + p.long + '|' + fmtPct(r.rate) + '|' + r.h + ' dari ' + r.e + ' anak hadir') + '">' + Math.round(r.rate * 100) + '</div>';
    });
  });
  h += '</div></div>';
  var lab = ['<60', '60', '70', '80', '85', '90', '≥95'];
  h += '<div class="heat-scale"><span>Kehadiran (%)</span><span class="steps">' + lab.map(function (l, k) { return '<i style="background:var(--heat-' + k + ')" title="' + l + '%"></i>'; }).join('') + '</span><span>&lt;60% → ≥95%</span></div>';
  el.innerHTML = h;
}

/* Kartu grafik bisa ditukar ke tampilan tabel */
var chartMode = {};
function tableToggle(id) {
  var t = chartMode[id] === 'table';
  return '<div class="tools"><button class="icon-btn" data-act="toggleView" data-id="' + id + '" title="' + (t ? 'Lihat grafik' : 'Lihat tabel') + '" aria-label="' + (t ? 'Lihat grafik' : 'Lihat tabel') + '">' + ico(t ? 'chart' : 'table', 17) + '</button></div>';
}
function mountChart(id, el, drawChart, drawTable) {
  if (chartMode[id] === 'table') el.innerHTML = '<div class="tbl-wrap">' + drawTable() + '</div>';
  else drawChart(el);
}
function tableHtml(head, rows) {
  return '<table class="tbl"><thead><tr>' + head.map(function (x, i) { return '<th' + (i ? ' class="r"' : '') + '>' + esc(x) + '</th>'; }).join('') + '</tr></thead><tbody>' +
    rows.map(function (r) { return '<tr>' + r.map(function (c, i) { return '<td' + (i ? ' class="r num"' : '') + '>' + esc(c) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table>';

/* ---------- PENERIMA ---------- */
VIEWS.penerima = function () {
  var F = filteredPeople(), q = S.pen.q.trim().toLowerCase();

  });

      '<td><span class="tag ' + kabCls(r.kab) + '">' + esc(r.pulau) + '</span><div class="muted" style="font-size:11.5px">' + r.kabS + '</div></td>' +

/* ---------- ABSENSI ---------- */
/* Absensi masih "terbuka": bulan berjalan/mendatang atau wilayah belum diabsen → anak yang belum dicentang tampil netral */
function absOpen(per, kab) { return per.eff === 'Belum' || per.key >= todayIso().slice(0, 7) || !per.recorded[kab]; }
function absDefaultPeriod() {
  var cur = todayIso().slice(0, 7), P = S.M.P;
  var p = P.find(function (x) { return x.key === cur; }) || P.filter(function (x) { return x.key <= cur; }).pop() || P[P.length - 1];
  return p ? p.key : null;
}
VIEWS.absensi = function () {
  var M = S.M, A = S.abs;
  if (A.tab === 'scan') return scanView();
  if (!A.period || !M.P.some(function (p) { return p.key === A.period; })) A.period = absDefaultPeriod();
  var per = M.P.find(function (p) { return p.key === A.period; });
  if (!per) return pageHead('Absensi', 'Belum ada kolom bulan di sheet absensi.');
  var draft = S.draft[A.period] || {};
  var pulauKab = M.pulauList.filter(function (p) { return M.pulauKab[p] === A.kab; });
  var base = M.people.filter(function (r) { return r.kab === A.kab && r.elig[per.i]; });
  var q = A.q.trim().toLowerCase();
  var list = base.filter(function (r) { return (!A.pulau || r.pulau === A.pulau) && (!q || r.search.indexOf(q) >= 0); });
  var isNew = absOpen(per, A.kab);
  var stateOf = function (r) {
    var d = draft[r.id];
    var orig = { hadir: r.att[per.i] === 1, ket: r.ket[per.key] || '' };
    return d ? { hadir: d.hadir, ket: d.ket != null ? d.ket : orig.ket, dirty: true } : { hadir: orig.hadir, ket: orig.ket, dirty: false };
  };
  if (A.view === 'belum') list = list.filter(function (r) { return !stateOf(r).hadir; });
  var hadirN = list.filter(function (r) { return stateOf(r).hadir; }).length;
  var dirtyN = Object.keys(draft).length;

  var h = pageHead('Absensi Penyaluran', 'Tandai anak yang hadir langsung. Yang tidak hadir tetap menerima santunan melalui wali.');
  h += absTabs();
  h += '<div class="abs-top"><div class="fl"><label for="aPer">' + ico('cal', 15) + '</label><select id="aPer" data-abs="period">' +
    M.P.slice().reverse().map(function (p) { return opt(p.key, p.long + (p.eff === 'Belum' ? ' · belum' : p.eff === 'Tanpa Absensi' ? ' · tanpa absensi' : ''), A.period); }).join('') + '</select></div>' +
    '<div class="seg" role="group" aria-label="Wilayah"><button data-act="absKab" data-kab="Utara" aria-pressed="' + (A.kab === 'Utara') + '">Hari 1 · KSU</button><button data-act="absKab" data-kab="Selatan" aria-pressed="' + (A.kab === 'Selatan') + '">Hari 2 · KSS</button></div>' +
    '<div class="search">' + ico('search', 17) + '<input id="absQ" type="search" placeholder="Cari nama anak…" value="' + esc(A.q) + '" autocomplete="off"></div>' +
    '<div class="fl"><label for="aTgl">Tanggal</label><input id="aTgl" type="date" data-abs="tgl" value="' + esc(A.tgl) + '" style="border:0;background:transparent;height:36px;outline:none"></div></div>';
  h += '<div class="pills" role="group" aria-label="Pulau"><button class="pill" data-act="absPulau" data-pulau="" aria-pressed="' + (!A.pulau) + '">Semua <small>' + base.length + '</small></button>' +
    pulauKab.map(function (p) { var n = base.filter(function (r) { return r.pulau === p; }).length; return n ? '<button class="pill" data-act="absPulau" data-pulau="' + esc(p) + '" aria-pressed="' + (A.pulau === p) + '">' + esc(p) + ' <small>' + n + '</small></button>' : ''; }).join('') + '</div>';
  if (per.eff === 'Tanpa Absensi') h += '<div class="rule mt">' + ico('info', 18) + '<div>Periode ini berstatus <b>Tanpa Absensi</b> — santunan tetap dihitung, tetapi kehadiran tidak masuk statistik. Ubah statusnya di halaman Penyaluran bila absensi ingin dicatat.</div></div>';
  if (per.eff === 'Dibatalkan') h += '<div class="rule mt">' + ico('info', 18) + '<div>Periode ini berstatus <b>Dibatalkan</b>.</div></div>';
  h += '<div class="abs-sum"><span class="chip good">' + ico('check', 13) + fmtN(hadirN) + ' hadir</span><span class="chip ' + (isNew ? 'outline' : 'crit') + '">' + fmtN(list.length - hadirN) + (isNew ? ' belum ditandai' : ' tidak hadir') + '</span>' +
    '<div class="seg" style="margin-left:auto"><button data-act="absView" data-v="semua" aria-pressed="' + (A.view === 'semua') + '">Semua</button><button data-act="absView" data-v="belum" aria-pressed="' + (A.view === 'belum') + '">Belum hadir</button></div>' +
    '<button class="btn sm" data-act="absAll">' + ico('check', 15) + 'Tandai semua hadir</button></div>';
  h += '<div class="abs-list">';
  if (!list.length) h += '<div class="card empty">Tidak ada anak di filter ini</div>';
  var reasons = S.data.settings.ketOptions || [];
  list.forEach(function (r) {
    var s = stateOf(r);
    var cls = s.hadir ? 'on' : (isNew && !s.dirty ? '' : 'off');
    var label = s.hadir ? ico('check', 17) + 'Hadir' : (isNew && !s.dirty ? 'Belum hadir' : ico('x', 17) + 'Tidak hadir');
    var warnBadge = r.level === 'peringatan' ? '<span class="chip crit" style="height:20px;font-size:11px">' + ico('alert', 12) + 'Wajib hadir</span>' : r.level === 'waspada' ? '<span class="chip warn" style="height:20px;font-size:11px">Waspada</span>' : '';
    h += '<div class="arow' + (s.dirty ? ' dirty' : '') + '"><div class="who"><b>' + esc(titleCase(r.nama)) + '</b><span>' + esc(r.pulau) + ' · ' + esc(r.status) + warnBadge + '</span></div>' +
      '<button class="tog ' + cls + '" data-act="absTog" data-id="' + esc(r.id) + '" aria-pressed="' + s.hadir + '">' + label + '</button>';
    if (!s.hadir && (s.dirty || !isNew)) {

/* Pencocokan nama di Recap Kehadiran (toleran salah ketik) */
function nk(s) { return String(s || '').toUpperCase().replace(/[^A-Z ]/g, ' ').replace(/\s+/g, ' ').trim(); }
function bigrams(s) { var b = {}; s = s.replace(/ /g, ''); for (var i = 0; i < s.length - 1; i++) { var k = s.substr(i, 2); b[k] = (b[k] || 0) + 1; } return b; }
function dice(a, b) { var A = bigrams(a), B = bigrams(b), inter = 0, na = 0, nb = 0, k; for (k in A) na += A[k]; for (k in B) nb += B[k]; for (k in A) if (B[k]) inter += Math.min(A[k], B[k]); return na + nb ? 2 * inter / (na + nb) : 0; }
var recapCache = null;
function matchRecap(x) {
  var key = nk(x.nama), pl = nk(x.pulau), best = null, bs = 0;
  S.M.people.forEach(function (r) {
    if (pl && nk(r.pulau) !== pl) return;
    var s = nk(r.nama) === key ? 1 : dice(nk(r.nama), key);
    if (s > bs) { bs = s; best = r; }
  });
  return bs >= 0.72 ? best : null;
}
function recapFor(r) {
  if (!recapCache) { recapCache = {}; (S.data.recap || []).forEach(function (x) { var m = matchRecap(x); if (m) recapCache[m.id] = x; }); }
  return recapCache[r.id] || null;
}

function loadScript(url) {
  if (loadedScripts[url]) return loadedScripts[url];
  loadedScripts[url] = new Promise(function (res, rej) {
    var s = document.createElement('script');
    s.src = url; s.async = true;
    s.onload = function () { res(); };
    s.onerror = function () { delete loadedScripts[url]; rej(new Error('Gagal memuat pustaka (cek koneksi internet)')); };
    document.head.appendChild(s);
  });
  return loadedScripts[url];
}

/* ---- feedback: kartu besar + bunyi + getar ---- */
var audioCtx = null;
function beep(kind) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    var seq = kind === 'ok' ? [[880, 0, 0.12]] : kind === 'warn' ? [[520, 0, 0.1], [520, 0.16, 0.1]] : [[200, 0, 0.32]];
    seq.forEach(function (n) {
      var o = audioCtx.createOscillator(), g = audioCtx.createGain(), t = audioCtx.currentTime + n[1];
      o.frequency.value = n[0]; o.type = kind === 'err' ? 'square' : 'sine';
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.25, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + n[2]);
      o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t + n[2] + 0.02);
    });
  } catch (e) { /* tanpa suara */ }
  try { if (navigator.vibrate) navigator.vibrate(kind === 'ok' ? 60 : [80, 60, 80]); } catch (e) { /* tanpa getar */ }
}
var flashTimer = null;
function feedback(kind, title, sub) {
  beep(kind);
  var f = $('#scanFlash');
  if (!f) { toast(title + (sub ? ' — ' + sub : ''), kind === 'ok' ? 'ok' : 'err'); return; }
  f.className = 'flash on ' + kind;
  f.innerHTML = ico(kind === 'ok' ? 'okc' : kind === 'warn' ? 'info' : 'noc', 30) + '<div><b>' + esc(title) + '</b><span>' + esc(sub || '') + '</span></div>';
  clearTimeout(flashTimer);
  flashTimer = setTimeout(function () { f.className = 'flash'; }, kind === 'ok' ? 2200 : 3200);
}

/* ---- inti: satu hasil scan ---- */
function handleScan(text, metode) {
  var now = Date.now();
  if (text === scan.last.code && now - scan.last.t < 4000) return;
  scan.last = { code: text, t: now };
  var r = findRec(text);
  if (!r) return feedback('err', 'QR tidak dikenal', String(text).slice(0, 40));
  var key = r.noId || r.id;
  var hit = scan.list.find(function (x) { return x.id === key; });
  if (hit) return feedback('warn', titleCase(r.nama), 'Sudah absen pukul ' + String(hit.waktu).slice(0, 5));
  var item = { id: key, nama: r.nama, pulau: r.pulau, kab: r.kab, status: r.status, waktu: nowHms(), metode: metode, sent: false };
  scan.list.unshift(item);
  scan.queue.push({ date: scan.date, code: qrPayload(r), time: new Date().toISOString(), metode: metode });
  store.set('scanq', scan.queue);
  markLocal(r.id, scan.date);
  feedback('ok', titleCase(r.nama), r.pulau + ' · ' + r.status + (r.level === 'peringatan' ? ' · wajib hadir ✓' : ''));
  updateScanUI();
  flushQueue();
}
function markLocal(id, date) {
  var pi = S.data.periods.findIndex(function (p) { return p.key === date.slice(0, 7); });
  var rec = S.data.recipients.find(function (x) { return x.id === id; });

}
function flushQueue() {
  if (scan.flushing || !scan.queue.length) return;
  scan.flushing = true;
  var date = scan.queue[0].date;
  var batch = scan.queue.filter(function (q) { return q.date === date; }).slice(0, 40);
  API.record(date, batch.map(function (q) { return { code: q.code, time: q.time, metode: q.metode }; })).then(function (res) {
    var sent = batch.map(function (q) { return q.code + '|' + q.time; });
    scan.queue = scan.queue.filter(function (q) { return sent.indexOf(q.code + '|' + q.time) < 0; });
    store.set('scanq', scan.queue);
    scan.online = true; scan.flushing = false;
    (res.results || []).forEach(function (x) {
      var id = parseCode(x.code);
      var r = findRec(x.code), key = r ? (r.noId || r.id) : id;
      var it = date === scan.date ? scan.list.find(function (y) { return y.id === key; }) : null;
      if (x.status === 'tidak_ditemukan') { if (it) scan.list.splice(scan.list.indexOf(it), 1); toast('QR ' + id + ' tidak ditemukan di Database', 'err'); }
      else if (it) { it.sent = true; if (x.status === 'duplikat' && x.waktu) it.waktu = x.waktu; }
    });
    if (res.warning) toast(res.warning, 'err');
    updateScanUI();
    if (scan.queue.length) setTimeout(flushQueue, 250);
    clearTimeout(scan.bg); scan.bg = setTimeout(function () { load(false); }, 20000);
  }).catch(function (e) {
    scan.flushing = false;
    if (e.code === 'AUTH') return logout(e.message);
    scan.online = false; updateScanUI();
    setTimeout(flushQueue, 5000);
  });
}

function camFail(msg) {

function prepareDecoder() {
  if (cam.detector) return Promise.resolve();
  if ('BarcodeDetector' in window && BarcodeDetector.getSupportedFormats) {
    return BarcodeDetector.getSupportedFormats().then(function (f) {
      if (f.indexOf('qr_code') >= 0) { cam.detector = new BarcodeDetector({ formats: ['qr_code'] }); return; }
      return loadScript(JSQR_URL);
    }).catch(function () { return loadScript(JSQR_URL); });
  }

}
function startCamera() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return camFail('Browser ini tidak mendukung kamera. Gunakan Foto QR atau input manual.');
  var btn = $('#camBtn'); if (btn) btn.disabled = true;
  navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false })
    .then(function (stream) {
      cam.stream = stream;
      var v = $('#camVideo'); v.srcObject = stream; v.muted = true; v.setAttribute('playsinline', '');
      return v.play();
    })
    .then(prepareDecoder)
    .then(function () { cam.running = true; updateCamUI(); tick(); })
    .catch(function (e) {
      var denied = e && (e.name === 'NotAllowedError' || e.name === 'SecurityError');
      camFail(denied ? 'Izin kamera ditolak. Izinkan akses kamera untuk situs ini di pengaturan browser, lalu coba lagi.' : (e && e.message) || String(e));

  if (b) b.className = cam.running ? 'btn' : 'btn primary';

  if (box) box.classList.toggle('live', cam.running);
}
function tick() {
  if (!cam.running) return;
  var v = $('#camVideo');
  if (!v || v.readyState < 2 || cam.busy) { cam.timer = setTimeout(tick, 150); return; }
  cam.busy = true;
  decodeFrom(v, 720, 'dontInvert').then(function (txt) {
    cam.busy = false;
    if (txt) handleScan(txt, 'QR');
    cam.timer = setTimeout(tick, txt ? 700 : 110);
  }).catch(function () { cam.busy = false; cam.timer = setTimeout(tick, 300); });
}
function decodeFrom(src, maxSide, inv) {
  if (cam.detector) return cam.detector.detect(src).then(function (c) { return c && c[0] ? c[0].rawValue : null; });
  var w = src.videoWidth || src.naturalWidth || src.width, h = src.videoHeight || src.naturalHeight || src.height;
  if (!w || !h || !window.jsQR) return Promise.resolve(null);

}

    }).catch(function (e) { feedbackBusy(false); feedback('err', 'Gagal membaca foto', e.message || ''); });
  };

  img.src = url;
}

  return '<svg viewBox="-2 -2 ' + (n + 4) + ' ' + (n + 4) + '" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg"><rect x="-2" y="-2" width="' + (n + 4) + '" height="' + (n + 4) + '" fill="#fff"/><path d="' + d + '" fill="#000"/></svg>';

      id = m.id;
    }
    saveCall('saveBantuan', { id: id, bentuk: (f.bentuk || []).join(', '), status: f.status, ket: f.ket }, el, 'Bantuan lanjutan tersimpan').catch(function () {});
  },
  editRecap: function (el) { openRecapForm(el.getAttribute('data-id')); },
  saveRecap: function (el) {
    var f = formData(), id = $('#mform').getAttribute('data-id'), rc = recapFor(S.M.byId[id]);
    if (!f.kendala && !f.keterangan) return toast('Isi keterangan atau kendala', 'err');
    saveCall('saveRecap', { id: id, row: rc ? rc.row : null, recapNama: rc ? rc.nama : '', lama: f.lama, keterangan: f.keterangan, kendala: f.kendala }, el, 'Kendala kehadiran tersimpan').catch(function () {});
  },
  savePeriod: function (el) {
    var f = formData(); f.key = $('#mform').getAttribute('data-id');
    saveCall('savePeriod', f, el, 'Periode diperbarui').catch(function () {});
  },
  install: function () { if (!installEvt) return; installEvt.prompt(); installEvt.userChoice.then(function () { installEvt = null; $$('.install-slot').forEach(function (el) { el.innerHTML = ''; }); }); },
  absTab: function (el) { S.abs.tab = el.getAttribute('data-tab'); render(); },
  camToggle: function () { if (cam.running) stopCamera(); else startCamera(); },
  scanPick: function (el) { handleScan(el.getAttribute('data-code'), 'Manual'); var i = $('#scanInput'); if (i) { i.value = ''; i.focus(); } suggest(''); },
  logout: function () { logout(''); },
  openQr: function () {
    var F = filteredPeople(), q = S.pen.q.trim().toLowerCase();
    var list = F.filter(function (r) { return (!q || r.search.indexOf(q) >= 0) && (!S.pen.level || r.level === S.pen.level) && (!S.pen.jk || r.jk === S.pen.jk); });
    if (!list.length) return toast('Tidak ada penerima di filter ini', 'err');
    openQrForm(list);
  },
  printQr: function (el) {
    var f = formData(), ids = ($('#mform').getAttribute('data-ids') || '').split(',').filter(Boolean);
    busy(el, true);
    printQr(ids, f.size || 'm', f.urut || 'pulau').then(function () { closeLayer(); }).catch(function (e) { busy(el, false); toast(e.message || 'Gagal membuat QR', 'err'); });
  },
  csv: function () {
    var F = filteredPeople(), q = S.pen.q.trim().toLowerCase();
    var list = F.filter(function (r) { return (!q || r.search.indexOf(q) >= 0) && (!S.pen.level || r.level === S.pen.level) && (!S.pen.jk || r.jk === S.pen.jk); });
    var head = ['No ID', 'Nama', 'Kabupaten', 'Pulau', 'Status', 'JK', 'Tanggal Lahir', 'Usia', 'Pendidikan', 'Alamat', 'Hadir', 'Total Absensi', 'Kehadiran %', 'Status Kehadiran', 'Santunan Diterima'];
    var rows = list.map(function (r) { return [r.noId, r.nama, r.kab, r.pulau, r.status, r.jk, r.tglLahir, r.age, r.pendidikan, r.alamat, r.hadir, r.total, r.rate == null ? '' : Math.round(r.rate * 1000) / 10, r.level, r.santunan]; });
    downloadCsv('penerima-santunan-' + todayIso() + '.csv', head, rows);
  },
  csvWarn: function () {
    var list = filteredPeople().filter(function (r) { return r.level !== 'aman'; });
    downloadCsv('peringatan-kehadiran-' + todayIso() + '.csv', ['Nama', 'Pulau', 'Status', 'Tidak Hadir', 'Total Absensi', 'Beruntun', 'Terakhir Hadir', 'Level', 'Periode Tidak Hadir'],
      list.map(function (r) { return [r.nama, r.pulau, r.status, r.absentKeys.length, r.total, r.streak, r.lastHadir ? r.lastHadir.label : '', r.level, r.absentKeys.join(' ')]; }));
  }
};
function keepScroll(fn) { var y = window.scrollY; fn(); window.scrollTo(0, y); }

function downloadCsv(name, head, rows) {
  var q = function (v) { v = v == null ? '' : String(v); return /[",;\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  var csv = '﻿' + [head].concat(rows).map(function (r) { return r.map(q).join(','); }).join('\n');
  try {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    a.download = name; a.target = '_self'; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    toast('File ' + name + ' diunduh');
  } catch (e) { toast('Browser tidak mengizinkan unduhan', 'err'); }
}

function openInfo() {
  var d = S.data, m = d.meta || {}, st = d.settings;
  var issues = (m.issues || []).map(function (i) { return '<li><b>' + esc(i.label) + ' (' + i.count + ')</b><div class="muted" style="color:var(--muted);font-size:12px">' + esc(i.items.slice(0, 15).join(', ')) + (i.count > 15 ? '…' : '') + '</div></li>'; }).join('');
  var body = '<dl class="kv">' +
    '<dt>Sumber</dt><dd>' + (MODE === 'demo' ? 'Mode demo — data dari file Excel. Perubahan hanya tersimpan di browser ini.' : 'Google Spreadsheet “' + esc(m.spreadsheet || '') + '” (' + (MODE === 'remote' ? 'lewat website/aplikasi' : 'live') + ')') + '</dd>' +
    '<dt>Diperbarui</dt><dd>' + (S.lastSync ? S.lastSync.toLocaleString('id-ID') : '–') + '</dd>' +
    (m.user ? '<dt>Pengguna</dt><dd>' + esc(m.user) + '</dd>' : '') +
    (MODE !== 'demo' ? '<dt>Masuk sebagai</dt><dd>' + esc(S.petugas || '-') + ' · ' + (S.role === 'admin' ? 'Admin (semua menu)' : 'Petugas (absensi & scan)') + '</dd>' : '') +
    (MODE === 'remote' ? '<dt>Server</dt><dd style="font-size:12px;word-break:break-all">' + esc(API_URL) + '</dd>' : '') +
    '<dt>Cek perubahan</dt><dd>' + (MODE !== 'demo' ? 'Setiap ' + st.refresh + ' detik' : '–') + '</dd>' +
    '<dt>Nominal</dt><dd>' + Object.keys(st.nominal).map(function (k) { return esc(k) + ' ' + fmtRp(st.nominal[k]); }).join('<br>') + '</dd>' +
    '<dt>Peringatan</dt><dd>Tidak hadir &gt; ' + st.batas + '× (' + esc(st.mode) + ')' + (st.sejak ? ' sejak ' + esc(st.sejak) : '') + '</dd></dl>' +
    '<div class="install-slot" style="margin-top:14px">' + installHtml() + '</div>' +
    (issues ? '<div class="sec"><h4>Catatan kualitas data</h4><ul class="notes" style="display:flex;flex-direction:column;gap:6px">' + issues + '</ul></div>' : '');
  openLayer('<div class="md-h"><h3>Info data</h3><button class="icon-btn" data-act="close" aria-label="Tutup">' + ico('x') + '</button></div><div class="md-b">' + body + '</div><div class="md-f"><button class="btn primary" data-act="close">Tutup</button></div>', 'modal');
}

/* Delegasi event */
document.addEventListener('click', function (ev) {
  var el = ev.target.closest('[data-act]');
  if (!el) return;
  var a = el.getAttribute('data-act');
  if (ACT[a]) { if (el.tagName === 'BUTTON' && el.closest('form')) ev.preventDefault(); ACT[a](el, ev); }
});
document.addEventListener('keydown', function (ev) {
  if (ev.key === 'Escape') { closeLayer(); hideTip(); return; }
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches('tr[data-act], .tile[data-act], .kcard[data-act]')) { ev.preventDefault(); ev.target.click(); }
});
document.addEventListener('change', function (ev) {
  var t = ev.target;
  if (t.hasAttribute('data-f')) {
    S.f[t.getAttribute('data-f')] = t.value;
    if (t.getAttribute('data-f') === 'kab' && S.f.pulau && S.M.pulauKab[S.f.pulau] !== t.value && t.value) S.f.pulau = '';
    store.set('filters', S.f); render();
  } else if (t.hasAttribute('data-pen')) { S.pen[t.getAttribute('data-pen')] = t.value; render(); }
  else if (t.hasAttribute('data-abs')) { S.abs[t.getAttribute('data-abs')] = t.value; if (t.getAttribute('data-abs') === 'period') render(); }
  else if (t.hasAttribute('data-absket')) {
    var id = t.getAttribute('data-absket'), per = S.M.P.find(function (p) { return p.key === S.abs.period; }), r = S.M.byId[id];
    var dr = S.draft[S.abs.period] = S.draft[S.abs.period] || {};
    var cur = dr[id] || { hadir: r.att[per.i] === 1, ket: r.ket[per.key] || '' };
    cur.ket = t.value.trim(); dr[id] = cur; saveDraft(); keepScroll(render);
  }
});
var onSearch = debounce(function (t) {
  var pos = t.selectionStart, id = t.id;
  if (id === 'penQ') S.pen.q = t.value; else S.abs.q = t.value;
  keepScroll(render);
  var n = document.getElementById(id); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {} }
}, 180);
document.addEventListener('input', function (ev) { if (ev.target.id === 'penQ' || ev.target.id === 'absQ') onSearch(ev.target); });

/* Tooltip untuk elemen ber-data-tip (bar, sel heatmap) */
function tipHtml(s) { var p = s.split('|'); return '<div class="t">' + esc(p[0]) + '</div>' + (p[1] ? '<div class="r"><b>' + esc(p[1]) + '</b><span>' + esc(p[2] || '') + '</span></div>' : ''); }
document.addEventListener('pointerover', function (ev) { var el = ev.target.closest('[data-tip]'); if (el && el.getAttribute('data-tip')) { var b = ev; showTip(tipHtml(el.getAttribute('data-tip')), b.clientX, b.clientY); } });
document.addEventListener('pointermove', function (ev) { var el = ev.target.closest('[data-tip]'); if (el && el.getAttribute('data-tip') && tip && tip.classList.contains('on')) showTip(tipHtml(el.getAttribute('data-tip')), ev.clientX, ev.clientY); });
document.addEventListener('pointerout', function (ev) { if (ev.pointerType !== 'touch' && ev.target.closest('[data-tip]')) hideTip(); });
document.addEventListener('pointerdown', function (ev) { if (!ev.target.closest('[data-tip]') && !ev.target.closest('svg')) hideTip(); });
document.addEventListener('submit', function (ev) {
  ev.preventDefault();
  if (ev.target.id === 'loginForm') return doLogin(ev.target);
  var ok = $('#okBtn'); if (ok && !ok.disabled) ok.click();
});
document.addEventListener('focusin', function (ev) { var el = ev.target.closest && ev.target.closest('[data-tip]'); if (el && el.getAttribute('data-tip')) tipAtEl(el, tipHtml(el.getAttribute('data-tip'))); });
document.addEventListener('focusout', function (ev) { if (ev.target.closest && ev.target.closest('[data-tip]')) hideTip(); });

/* Render ulang saat lebar berubah (grafik responsif) */
var lastW = 0;
window.addEventListener('resize', debounce(function () { var w = window.innerWidth; if (Math.abs(w - lastW) > 30) { lastW = w; if (!$('#layer').innerHTML && !cam.running && S.data) keepScroll(render); } }, 220));
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { if (!S.theme) render(); }); } catch (e) { /* browser lama */ }

/* Jangan render ulang saat pengguna sedang mengetik — tunda sampai input dilepas */
var pendingRender = false;
function typing() { var a = document.activeElement; return a && a.closest && a.closest('#view') && /^(INPUT|TEXTAREA)$/.test(a.tagName) && a.type !== 'search'; }
document.addEventListener('focusout', function () { if (pendingRender) setTimeout(function () { if (!typing() && pendingRender) { pendingRender = false; keepScroll(render); } }, 50); });

/* =========================================================
   SINKRONISASI REALTIME
   ========================================================= */
function showApp() { var b = $('#boot'); b.hidden = true; b.style.display = 'none'; $('#app').hidden = false; }
function load(force, manual) {
  if (MODE === 'empty') {
    $('#boot').innerHTML = '<span class="logo"></span><p style="max-width:360px;text-align:center">Dashboard ini perlu dibuka melalui URL Web App Google Apps Script agar terhubung ke Google Spreadsheet.</p>';
    return Promise.resolve();
  }
  if (MODE !== 'demo' && !S.pin) { showLogin(''); return Promise.resolve(); }
  S.syncing = true; if (S.data) { renderSync(); $('#view').classList.add('is-syncing'); }
  return API.load().then(function (d) {
    setData(d);
    cacheData(d);
    store.set('role', S.role);
    S.syncing = false;
    showApp();
    if (cam.running) { renderNav(); updateScanUI(); }
    else if (typing() && !force) { pendingRender = true; renderNav(); }
    else if (!$('#layer').innerHTML || force) keepScroll(render); else renderNav();
    $('#view').classList.remove('is-syncing');
    if (manual) toast(MODE === 'demo' ? 'Data demo dimuat ulang' : 'Data terbaru dimuat');
  }).catch(function (e) {
    S.syncing = false;
    $('#view').classList.remove('is-syncing');
    if (e.code === 'AUTH') return logout(e.message);
    S.error = e;
    if (!S.data) {
      var cached = MODE === 'remote' ? store.get('dataCache', null) : null;
      if (cached) {
        setData(cached); S.error = e; showApp(); render();
        toast('Offline — menampilkan data terakhir. Scan tetap bisa, dikirim saat online.', 'err');
        return;
      }
      $('#boot').innerHTML = '<span class="logo"></span><p style="max-width:380px;text-align:center">Gagal memuat data: ' + esc(e.message || e) + '</p><button class="btn" onclick="location.reload()">Coba lagi</button>';
    } else { renderSync(); if (!cam.running) toast('Gagal sinkron: ' + (e.message || e), 'err'); }
  });
}

function poll() {
  if (MODE === 'demo' || MODE === 'empty' || !S.pin || document.hidden || S.syncing) return;
  // Pengaman: muat ulang penuh tiap 5 menit walau token versi tidak berubah (mis. trigger belum terpasang)
  if (S.lastFull && Date.now() - S.lastFull > 300000) { load(false); return; }
  API.version().then(function (v) {
    if (S.error) S.error = null;
    if (v && v !== S.version) {
      var drawerOpen = !!$('#layer').innerHTML;
      load(false).then(function () { if (!drawerOpen && !cam.running) toast('Data diperbarui dari Spreadsheet'); });
    } else { S.lastSync = new Date(); renderSync(); }
  }).catch(function (e) { S.error = e; renderSync(); });
}

/* Start */
if (S.theme) document.documentElement.setAttribute('data-theme', S.theme);
lastW = window.innerWidth;
load().then(function () { if (S.data) startPolling(); });
window.__antheia = { S: S, scan: scan, cam: cam, render: render };  // untuk pengecekan / debugging
})();
</script>
<script>if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }</script>
</body>
